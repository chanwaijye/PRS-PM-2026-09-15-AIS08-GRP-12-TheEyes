# calib_agent configuration.

board:
  # ChArUco: a chessboard with ArUco markers in the white squares. Chosen over a
  # plain chessboard because it tolerates partial views and occlusion -- corners
  # are identified by their marker, so a board half out of frame still
  # contributes, which matters when two cameras at very different angles must
  # see it simultaneously.
  #
  # ORDERED, reported by the user 2026-09-03 as arriving in ~2 days (~09-05):
  # 324 x 324 mm panel, 8 x 8 squares
  # at 38 mm = 304 x 304 mm of squares, 49 interior corners, 32 markers.
  #
  # Decode reach. A DICT_5X5 marker is 7 modules across (5 bits + a 1-module
  # quiet border) and stops decoding below ~3 px/module:
  #
  #     max distance = fx * marker_length / (3 * marker_modules)
  #
  # On this rig the far corner of this board lying on the table sits 884 mm from
  # the camera, not 700 mm -- the cameras are oblique at 35 deg elevation.
  # Against the MEASURED factory colour fx (calibration_backup/, worst unit):
  #
  #     848 x 480    fx  603    2.8 px/module   FAILS   (reach 0.82 m)
  #     1280 x 720   fx  905    4.2 px/module   ok      (reach 1.23 m)
  #     1920 x 1080  fx 1358    6.3 px/module   good    (reach 1.84 m)
  #
  # So this board REQUIRES calibration captures at 1920x1080. That is not a
  # workaround: the recovered camera POSE is resolution-independent (same
  # projection centre, differently sampled), so it stays valid while the
  # pipeline streams 848x480. Capture with `calibrate run ... --factory`.
  # BoardSpec::MaxDecodeDistance computes this, and the CLI prints it before
  # detecting -- a board that cannot decode returns zero corners from images
  # that look perfectly good.
  #
  # MEASURED on the physical board 2026-09-05. Three of the four values are now
  # closed; only marker_length_m is still derived.
  #   squares_x/y      8 x 8. CONFIRMED: `calibrate aim` resolved 49 corners on
  #                    both cameras, and 7 x 7 = 49 is exactly what an 8 x 8
  #                    board gives. A wrong count maps corner ids to the wrong 3D
  #                    points -- the classic ChArUco bug, which shows up as a
  #                    large reprojection RMSE the 0.5 px gate catches without
  #                    the message ever saying so.
  #   square_length_m  MEASURED: callipers spanning 4 squares read 152.1 mm, so
  #                    152.1 / 4 = 38.025 mm. That is +0.066% against the 38 mm
  #                    nominal -- comfortably inside the 1-2% that printed boards
  #                    routinely drift, and worth carrying because this value
  #                    scales every distance in the system while every
  #                    reprojection error stays small.
  #   marker_length_m  [VERIFY] DERIVED, not measured. The board is one printed
  #                    image, so the +0.066% scale applies to the markers too:
  #                    0.75 * 38.025 = 28.519 mm. Strictly better than 28.5,
  #                    which now assumes a scale factor of exactly 1.0 that the
  #                    square measurement has disproved -- but callipers on a
  #                    marker would close it properly. Low stakes either way: the
  #                    chessboard corners carry the solve, and marker length only
  #                    feeds decode reach and marker identification.
  #   dictionary       DICT_5X5_250. CONFIRMED by the fact that markers decoded
  #                    at all -- a mismatch decodes NOTHING.
  squares_x: 8
  squares_y: 8
  square_length_m: 0.038025
  marker_length_m: 0.028519
  dictionary: "DICT_5X5_250"

world:
  frame: table_origin
  # Pose of the board's origin corner in the world frame, row-major 4x4.
  #
  # This is what DEFINES the world frame: the board is placed at a known,
  # measured location on the table, and every camera pose is derived from it.
  # An error here is a rigid offset applied to every fused pose. It is invisible
  # to every downstream check, because everything stays self-consistent -- note
  # in particular that quality.max_round_trip_error_m CANNOT catch it, by
  # construction: the round trip asks whether the two cameras agree with each
  # other, and a wrong T_world_board is a rigid transform applied to both
  # (Report.RoundTripMeasuresTheRigNotTheWorldPlacement pins that).
  #
  # WORLD FRAME. Origin at the WORKSPACE CENTRE, on the tabletop.
  #   +x  along the table's 1180 mm width, to your right
  #   +y  toward the BACK edge, away from you
  #   +z  up
  # Chosen so the recovered camera positions come out as the RIG_BOM.md numbers
  # directly -- roughly (+-0.369, -0.439, +0.402) -- which is what makes a tape
  # measure a valid check on the result.
  #
  # BOARD PLACEMENT. Pattern-up, the printed image readable from where you sit,
  # the 304 mm PATTERN (not the 324 mm panel) centred on the workspace centre.
  # Tape the four pattern corners, not the panel edges: the ~10 mm border may
  # not be symmetric, and taping by the panel would offset the whole world frame
  # by however far off-centre it was printed.
  #
  # WHY NOT IDENTITY. The ChArUco board frame has +y running DOWN the printed
  # image and +z INTO the panel -- x cross y goes through the board, away from a
  # camera viewing the printed face. VERIFIED against OpenCV 4.6
  # estimatePoseCharucoBoard, which returns identity rotation for a
  # fronto-parallel board. So a board lying pattern-up has +z pointing DOWN in
  # world terms, and both y and z flip: R = Rx(180 deg) = diag(1, -1, -1).
  #
  # Identity was the shipped value and it is WRONG. Confirmed on a real capture:
  # with identity, the solve placed the two cameras at world z = -642 mm and
  # -428 mm while they were plainly above the board looking down. The report
  # raised no complaint -- the maths is self-consistent, it just describes a
  # mirrored rig.
  #
  # TRANSLATION. The board origin corner is the image top-left of the pattern,
  # which with this placement is the BACK-LEFT corner:
  #   x = -(squares_x * square_length_m) / 2 = -0.152
  #   y = +(squares_y * square_length_m) / 2 = +0.152
  #   z = board thickness -- the pattern is on the TOP face, and world z = 0 is
  #       the tabletop, the plane objects actually rest on.
  #
  # 0.1521 is 4 x square_length_m, updated with the measured 38.025 mm. These
  # two ALWAYS move with square_length_m -- editing one without the other is a
  # silent, self-consistent error.
  #
  # z = 0.0071 is the MEASURED board thickness (callipers on the panel edge,
  # 2026-09-05). The pattern is on the TOP face and world z = 0 is the tabletop,
  # the plane objects actually rest on, so this offset is what keeps the two
  # apart. Left at zero it was 7.1 mm of bias on every absolute world height
  # handed to PM1 -- invisible downstream, because the round trip, the
  # reprojection RMSE and the ablation are all invariant to this matrix.
  T_world_board: [ 1,  0,  0, -0.1521,
                   0, -1,  0,  0.1521,
                   0,  0, -1,  0.0071,
                   0,  0,  0,  1]

quality:
  # calib_agent's own target, and the gate fusion refuses to start above
  # (INTERFACES.md §4). Keep in step with fusion.yaml's
  # calibration.max_reprojection_rmse_px.
  max_reprojection_rmse_px: 0.5
  # A point seen by both cameras must land in the same world position from
  # either. This is the number that actually says whether the two views agree,
  # and it is the one to distrust first if fused poses look wrong.
  max_round_trip_error_m: 0.005
  # Intrinsic calibration needs many views at varied angles and distances;
  # below this the solution is under-constrained and the RMSE is meaninglessly
  # low because it is fitting noise.
  min_views_for_intrinsics: 12
  # Corners shared between the two cameras, needed before extrinsics are trusted.
  min_shared_corners: 12

# Session re-registration (calibrate reregister).
#
# The rig mounts cameras on floor tripods and uses a shared desk as the table,
# so the tabletop moves relative to the cameras between sessions. That breaks
# every T_world_cam silently. Re-registration recovers it from one board view
# per camera -- but ONLY if the cameras did not move relative to each other.
#
# T_camA_camB is invariant to the world frame moving, so comparing it against
# the stored calibration separates the two cases:
#   unchanged -> the table moved, re-registration is valid
#   changed   -> a camera moved, re-registration is INVALID, recalibrate
rigidity:
  # Must stay below quality.max_round_trip_error_m -- the loader enforces it.
  # A baseline error of X mm surfaces as roughly X mm of round-trip
  # disagreement, so a rig this check passes must not fail that one.
  max_baseline_shift_m: 0.003
  # Derived, not picked: atan(0.003 / 0.70) = 0.25 deg is the rotation that
  # induces the same lateral error at the 0.70 m working distance.
  max_baseline_rotation_deg: 0.25
  # A warning, not a gate. The table is EXPECTED to move -- that is the point.
  # But a desk does not slide 20 mm on its own, so a shift this large more
  # likely means the board was returned to the wrong spot. That silently
  # redefines the world frame and nothing downstream can detect it.
  warn_world_shift_m: 0.020
