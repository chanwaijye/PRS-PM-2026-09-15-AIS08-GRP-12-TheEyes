# camera_agent configuration.
#
# CLAUDE.md constraint 4: cameras are addressed by SERIAL NUMBER, never by
# /dev/video* or enumeration order. USB enumeration is not stable across
# reboots, and an index-based mapping will silently swap the two views during a
# live demo -- producing fused poses that are wrong in a way nothing downstream
# can detect, because everything stays internally consistent.
#
# The camera_id keys here are the same strings used for
# ObjectState::visible_views bit order in fusion.yaml and predicates.yaml.

cameras:
  cam_front:
    serial: "261722073945"
    # inter_cam_sync_mode: 0 = free-running, 1 = master, 2 = slave.
    #
    # Set to 1 / 2 ONLY once the physical sync cable is connected between the
    # two units' multi-camera sync connectors. Verified 2026-08-20: with
    # cam_over set to slave and NO cable, it opens fine and then never delivers
    # a frame -- a slave captures only when triggered, so the pipeline hangs
    # until the 5 s timeout. That is the R4b mitigation, and it is not a
    # software-only setting.
    #
    # This value is stored in the camera's NVRAM and PERSISTS ACROSS POWER
    # CYCLES, so it is written on every open, including 0 -- otherwise a unit
    # left in slave mode from a previous run stays stuck there.
    inter_cam_sync_mode: 1
  cam_over:
    serial: "261822074567"
    inter_cam_sync_mode: 2

streams:
  # 848x480 is the D435i's native depth resolution -- other sizes are scaled on
  # the ASIC and lose depth quality for nothing.
  depth_width: 848
  depth_height: 480
  color_width: 848
  color_height: 480
  fps: 30
  # Depth must be aligned to colour (INTERFACES.md §1): FoundationPose needs
  # registered RGB-D on one pixel grid.
  align_depth_to_color: true

  # Colour-sensor controls.
  #
  # Left on auto until 2026-09-09, which was not a neutral default but an active
  # control loop working against us: turning the room light on moved the table
  # surface by 2.7 grey levels, because the camera stopped down to cancel it.
  # Auto also lets the two units choose different exposures for the same scene
  # -- part of the measured 27% cross-camera R/G disagreement -- and makes a
  # session unreproducible. Both cameras take the SAME values deliberately:
  # different exposures make the two views incomparable, which is fatal to an
  # occlusion ablation.
  #
  # MEASURED on this rig, 2026-09-09, cam_front colour-only at 848x480:
  #
  #     exposure  gain   frame mean   fps
  #          166    64         10.7  30.0
  #          300    64         18.6  30.0   <- committed
  #          300   128         33.4  30.0
  #          600   128         54.9  16.6   below the sync requirement
  #         1000   128         75.8  10.0
  #         2500   128        124.1   4.0
  #         5000   128        163.1   0.5
  #
  # THE CEILING IS THE FRAME RATE, NOT THE SENSOR. 30 fps caps exposure at ~300
  # device units; past that the sensor drops frames and the hardware-synced
  # pairing this rig depends on falls apart. Even at 0.5 fps and maximum gain
  # the frame mean reaches only 163 against synth50k_v2's ~200.
  #
  # So the rig CANNOT be exposed into the training distribution. The remaining
  # camera-side headroom is gain 64 -> 128, worth about 2x and paid for in
  # sensor noise; everything else has to come from putting more light on the
  # scene. See docs/STATUS.md "Sim-to-real".
  #
  # `exposure` is in DEVICE UNITS, not microseconds -- range [1, 10000] on this
  # unit's colour sensor, default 166. The DEPTH sensor's exposure option is in
  # microseconds and the two are easy to confuse; writing microseconds here was
  # tried, went out of range, and was refused by the read-back check.
  color:
    auto_exposure: false
    exposure: 300
    gain: 64
    # Pinned rather than left to drift with whatever is lighting the room that
    # evening. 4600 K is the device default; the room's warm bulb pushed R/G
    # away from the synthetic set, so this is deliberately not "whatever the
    # room is".
    auto_white_balance: false
    white_balance_k: 4600

sync:
  # Frame timestamps across the two cameras must agree within one frame period
  # (INTERFACES.md §1), asserted at startup and logged.
  max_skew_ms: 33.0
  # Frames to sample when checking skew at startup. One frame could agree by
  # luck; a run of them establishes the streams are actually locked.
  startup_check_frames: 30

noise_characterisation:
  # Distances at which to measure a flat wall. The resulting plane-fit RMS per
  # distance feeds the evaluation error budget -- AGENTS.md calls this a
  # deliverable, not a debugging step.
  distances_m: [0.4, 0.6, 0.8, 1.0]
  # Central image region used for the plane fit, as a fraction of the frame.
  # The frame edges see the wall most obliquely and carry the worst depth, which
  # would dominate an RMS taken over the whole image.
  roi_fraction: 0.5
  frames_per_distance: 30
