# pose_agent tuning.

roi:
  # The detector's bbox is tight; FoundationPose wants surrounding context and
  # tolerance for bbox jitter. Fraction of bbox width/height added on each side.
  margin_ratio: 0.15
  # Below this, a crop carries too few depth pixels to constrain 6-DoF at all.
  # Detections producing a smaller ROI are dropped rather than estimated badly.
  min_size_px: 24

estimator:
  # "mock" | "foundationpose"
  backend: "mock"
  # Unix domain socket the FoundationPose Python server listens on.
  # Only used when backend is "foundationpose".
  socket_path: "/tmp/the_eyes_foundationpose.sock"
  # A per-request ceiling. FoundationPose registration measured ~1258 ms
  # typical and 4332 ms worst case on the RTX 5070 Ti (docs/R1_STATUS.md,
  # SystemCode/pose/README.md) at 5 refine iterations; the server now defaults
  # to 6 for registration robustness (docs/TRT_PLAN.md 7A), so scale both by
  # ~1.15. Tracking is unchanged at ~11-17 ms. 15 s clears the worst
  # registration with margin -- the server holds one CUDA lock, so a second
  # camera's registration can queue behind the first -- and still catches a
  # hung server rather than stalling the pipeline forever. The live runner
  # (SystemCode/runtime) warns below 10 s.
  request_timeout_ms: 15000

  # Below this hypothesis score the estimate is discarded rather than passed to
  # fusion. Fusion weights by score, so a very low-confidence pose is not free:
  # it still drags the fused estimate.
  min_score: 0.10
