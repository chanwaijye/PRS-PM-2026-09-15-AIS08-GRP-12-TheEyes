# Static scene objects -- things that exist in the world frame without being
# perceived. The runner injects these into every SceneState after fusion and
# before predicate extraction, so `(on red_cube_01 table_01)` can be emitted:
# nothing upstream ever detects the table, and without it no object is `on`
# anything (project review 2026-09-05, finding 5).
#
# Injected objects carry visible_views = every view bit (they are never
# occluded), confidence 1.0, velocity 0, and NO uncertainty (sigmas -1, per
# INTERFACES.md §5: no estimator produced them, so "absent" is the honest
# value rather than "perfectly known").
#
# Frame: the world frame from config/extrinsics.yaml (`table_origin`), whose
# origin is on the table top surface per docs/CALIBRATION_PROTOCOL.md. A
# box's pose is its CENTRE, so a table of thickness t sits at z = -t/2.
world_frame: table_origin

objects:
  - id: table_01
    cls: table
    # MEASURED 2026-09-08: the desk is 1180 x 750 x 23 mm. It is the real desk,
    # not the taped workspace -- objects can legitimately sit anywhere on it, and
    # since the top face is at z = 0 across the whole slab the depth choice only
    # affects XY overlap, which the real footprint gets right for free.
    #
    # The back ~310 mm of the 750 is occupied by a 43-inch TV (952 x 535 mm
    # panel) and its stand, which is why docs/RIG_BOM.md quotes 1180 x 440 mm
    # FREE on a 750 mm deep desk. No object is ever placed in that strip; the
    # slab is still modelled full-depth because that is what is physically there.
    #
    # World origin is the WORKSPACE CENTRE on the tabletop, +y toward the back
    # edge (config/calibration.yaml `world:`). The workspace is not centred on
    # the desk in y, so the slab's centre is offset in +y.
    #
    # [VERIFY] The y offset below is DERIVED, not measured: it assumes the
    # 440 mm free strip is the front of the desk and the workspace is centred
    # in it, giving 220 mm from origin to the front edge and 530 mm to the back,
    # so the slab centre sits at y = (530 - 220) / 2 = +0.155. One tape
    # measurement settles it -- origin (board pattern centre) to the desk's
    # FRONT edge, call it f, then t.y = 0.750/2 - f. x and z are not in doubt:
    # the workspace is centred in the 1180 width, and z = -t/2 puts the top
    # face on world z = 0.
    pose_w:
      t: [0.0, 0.155, -0.0115]   # centre, metres, world frame
      rpy_deg: [0.0, 0.0, 0.0]
    # Half-extents, metres, world-axis-aligned (ObjectState::extent).
    extent: [0.590, 0.375, 0.0115]
